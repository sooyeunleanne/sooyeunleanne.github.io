name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Publishing in Notion changes nothing in git, so the site needs a push that
  # isn't a commit: this button rebuilds and redeploys on demand.
  workflow_dispatch:
  # Safety net for a post published without pressing the button.
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # prebuild pulls published posts out of Notion before next build runs.
      # With the secrets unset the sync logs a warning and the blog builds empty
      # rather than failing the deploy.
      - run: npm run build
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

      - uses: actions/configure-pages@v5

      # path is relative to the workspace root, not the job's working-directory.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
